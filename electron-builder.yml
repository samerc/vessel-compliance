appId: com.electron.app
productName: vessel-compliance
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # SIC letter OCR uses only the LSTM engine builds (tesseract.js picks one at run time); the
  # others and the browser builds with embedded wasm (*.wasm.js) are ~35 MB the app never loads
  - '!node_modules/tesseract.js-core/*.wasm.js'
  - '!node_modules/tesseract.js-core/tesseract-core.{js,wasm}'
  - '!node_modules/tesseract.js-core/tesseract-core-simd.{js,wasm}'
  - '!node_modules/tesseract.js-core/tesseract-core-relaxedsimd.{js,wasm}'
asarUnpack:
  - resources/**
win:
  executableName: vessel-compliance
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# Hardening: the packaged app can no longer be started as a plain Node runtime or have code
# injected through NODE_OPTIONS / --inspect (the app itself never uses these)
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
publish:
  provider: github
  releaseType: release

